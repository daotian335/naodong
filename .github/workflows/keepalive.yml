name: keep-alive
# 免费保活：每天自动访问 naodong.tttttttttt.top，让免费主机一直"有流量"
# 避免 swb.cc/InfinityFree 因长期无人访问而冻结/删除账户（零成本、不需开电脑）
on:
  schedule:
    - cron: "23 4 * * *"   # UTC 04:23 ≈ 北京时间 12:23，每天自动 ping 一次
  workflow_dispatch: {}     # 也可手动在 GitHub 上点 Run workflow 立即触发
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping naodong site (keep free host alive)
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 "http://naodong.tttttttttt.top/" || true)
          echo "naodong ping -> HTTP $code"
          # 只要能连上（200 或主机JS挑战页都算访问成功）即可保活
